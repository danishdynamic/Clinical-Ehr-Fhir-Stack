version: "3.9"

services:

  postgres:
    image: postgres:16

    environment:
      POSTGRES_DB: ehr_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
      dockerfile: ../infra/docker/backend.Dockerfile

    ports:
      - "8000:8000"

    depends_on:
      - postgres

  frontend:
    build:
      context: ../frontend
      dockerfile: ../infra/docker/frontend.Dockerfile

    ports:
      - "3000:3000"

    depends_on:
      - backend

volumes:
  postgres_data: